name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aynı anda tek deploy çalışsın; yarım kalan sürüm devralınmasın
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle
        run: npm run build

      - name: Çıktı kontrolü
        run: |
          test -f dist/index.html || { echo "dist/index.html yok"; exit 1; }
          # Satır içi script/style CSP'yi bozar — derleme ayarı bozulmuşsa burada dur
          if grep -rqE '<script[^>]*>[^<]' dist --include='*.html'; then
            echo "HATA: satır içi <script> bulundu, CSP script-src 'self' ile çakışır"; exit 1
          fi
          if grep -rq '<style' dist --include='*.html'; then
            echo "HATA: satır içi <style> bulundu, CSP style-src 'self' ile çakışır"; exit 1
          fi

      - name: SSH anahtarını yükle
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host anahtarı sabitlenir; StrictHostKeyChecking=no KULLANILMAZ
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sürümü yükle
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          SITE: deresys.com.tr
        run: |
          RELEASE="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          rsync -az --delete \
            --chmod=D755,F644 \
            -e "ssh -p ${PORT:-22} -o StrictHostKeyChecking=yes" \
            dist/ "$USER@$HOST:/var/www/$SITE/releases/$RELEASE/"

      - name: Sürümü etkinleştir
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "${PORT:-22}" -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "/var/www/deresys.com.tr/bin/activate.sh '$RELEASE'"

      - name: Yayını doğrula
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://deresys.com.tr/ || true)
            [ "$code" = "200" ] && echo "yayın doğrulandı ($code)" && exit 0
            sleep 5
          done
          echo "HATA: site 200 dönmüyor (son kod: $code)"; exit 1

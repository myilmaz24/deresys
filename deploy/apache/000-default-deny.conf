# /etc/apache2/sites-available/000-default-deny.conf
#
# Apache, bir IP:port için sites-enabled içindeki İLK vhost'u varsayılan kabul
# eder ve yükleme sırası alfabetiktir. Bu yüzden dosya adı "000-" ile başlar.
# Alan adı eşleşmeyen istekler (IP taraması, yanlış Host başlığı) siteye ulaşamaz.
#
# nginx'ten fark: Apache'de "ssl_reject_handshake" karşılığı yok. TLS el sıkışması
# tamamlanmak zorunda olduğu için burada bir sertifika bulunmalı; snakeoil yeterli.
# İstemci sertifika uyarısı alır ve ardından 403 görür — site içeriği sızmaz.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/_default

    # ACME burada da karşılanır. Sebep: site vhost'u sertifika olmadan
    # etkinleştirilemez (SSLCertificateFile eksik → configtest başarısız),
    # sertifika da ACME olmadan alınamaz. Bu blok kilitlenmeyi çözer.
    Alias /.well-known/acme-challenge/ /var/www/_acme/.well-known/acme-challenge/
    <Directory /var/www/_acme/.well-known/acme-challenge/>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/_default>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    # ACME dışındaki her şey reddedilir
    RedirectMatch 403 "^/(?!\.well-known/acme-challenge/).*$"

    ErrorLog  ${APACHE_LOG_DIR}/default-deny.error.log
    CustomLog ${APACHE_LOG_DIR}/default-deny.access.log privacy
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/_default

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    <Directory /var/www/_default>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    RedirectMatch 403 ^/.*$

    ErrorLog  ${APACHE_LOG_DIR}/default-deny.error.log
    CustomLog ${APACHE_LOG_DIR}/default-deny.access.log privacy
</VirtualHost>

# /etc/apache2/sites-available/deresys.com.tr.conf

# --- HTTP: yalnızca ACME ve yönlendirme ---
<VirtualHost *:80>
    ServerName deresys.com.tr
    ServerAlias www.deresys.com.tr

    # Let's Encrypt doğrulaması
    Alias /.well-known/acme-challenge/ /var/www/_acme/.well-known/acme-challenge/
    <Directory /var/www/_acme/.well-known/acme-challenge/>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://deresys.com.tr%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/deresys.error.log
    CustomLog ${APACHE_LOG_DIR}/deresys.access.log privacy
</VirtualHost>

# --- HTTPS: www → apex ---
<VirtualHost *:443>
    ServerName www.deresys.com.tr

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/deresys.com.tr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/deresys.com.tr/privkey.pem

    Protocols h2 http/1.1

    Redirect permanent / https://deresys.com.tr/

    ErrorLog  ${APACHE_LOG_DIR}/deresys.error.log
    CustomLog ${APACHE_LOG_DIR}/deresys.access.log privacy
</VirtualHost>

# --- HTTPS: asıl site ---
<VirtualHost *:443>
    ServerName deresys.com.tr

    # "current" bir symlink; atomik yayın bunun üzerinden yapılır
    DocumentRoot /var/www/deresys.com.tr/current

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/deresys.com.tr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/deresys.com.tr/privkey.pem

    Protocols h2 http/1.1

    <Directory /var/www/deresys.com.tr/current>
        # FollowSymLinks zorunlu: DocumentRoot'un kendisi symlink.
        # SymLinksIfOwnerMatch kullanılmadı — symlink deploy'a, hedef de
        # deploy'a ait olsa bile her istekte ek stat çağrısı maliyeti var.
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Astro "directory" formatı: /cozumler/ → /cozumler/index.html
        DirectoryIndex index.html
    </Directory>

    # Gizli dosyalar, yedekler ve kaynak artıkları asla servis edilmez
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.|~$|\.(bak|orig|swp|log)$">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        # Hash'li varlıklar — içerik değişirse dosya adı değişir
        <LocationMatch "^/_astro/">
            Header always set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>

        # HTML önbelleğe alınmaz — deploy anında yayına girsin
        <LocationMatch "\.html$|^/$|/$">
            Header always set Cache-Control "no-cache, must-revalidate"
        </LocationMatch>
    </IfModule>

    ErrorDocument 404 /404.html

    ErrorLog  ${APACHE_LOG_DIR}/deresys.error.log
    CustomLog ${APACHE_LOG_DIR}/deresys.access.log privacy

    # --- İleride: form endpoint'i ---
    # CONTEXT.md: iletişim formu ve blog aboneliği VPS üzerinden çalışacak.
    # CSP form-action zaten 'self' olduğu için ek değişiklik gerekmez.
    # Hız sınırı için mod_ratelimit yetersizdir; mod_qos veya fail2ban
    # üzerinden bir filtre kurulmalı.
    #
    # <Location /api/iletisim>
    #     ProxyPass        http://127.0.0.1:8081/
    #     ProxyPassReverse http://127.0.0.1:8081/
    #     RequestHeader set X-Forwarded-Proto "https"
    # </Location>
</VirtualHost>

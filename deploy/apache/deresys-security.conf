# /etc/apache2/conf-available/deresys-security.conf
# Güvenlik başlıkları. "always" karşılığı Apache'de "Header always set" —
# hata sayfalarında da gönderilir.
#
# nginx'ten fark: Apache başlıkları alt bağlamlara MİRAS BIRAKIR. nginx'te
# bir location içindeki add_header üst bloktakileri siler ve her yerde tekrar
# eklemek gerekir; burada bir kez tanımlamak yeterlidir.

<IfModule mod_headers.c>
    # HTTPS zorunluluğu. preload listesine başvurmadan önce tüm alt alan
    # adlarının HTTPS sunduğundan emin ol; geri dönüşü zordur.
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    # İçerik Güvenliği Politikası.
    # Site tamamen self-host: harici font, script, görsel veya iframe yok.
    # Derleme satır içi script/style üretmediği için 'unsafe-inline' gerekmiyor.
    # Umami ayrı bir alt alan adına kurulursa script-src ve connect-src
    # o origin ile genişletilmeli.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"

    # Tarayıcı özelliklerini kapat — site hiçbirini kullanmıyor
    Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()"

    # Apache sürüm/dil bilgisi taşıyabilen başlıkları kaldır
    Header always unset X-Powered-By
    Header always unset X-Pingback
</IfModule>

# /etc/apache2/sites-available/deresys.com.tr.conf
#
# Cloudflare arkasında çalışır. Origin yalnızca 443 dinler ve yalnızca
# Cloudflare'den gelen bağlantıları kabul eder (bkz. Authenticated Origin Pulls
# ve cloudflare-ips.sh ile üretilen ufw kuralları).
#
# Port 80 bilinçli olarak açılmadı: HTTP→HTTPS yönlendirmesi Cloudflare'in
# "Always Use HTTPS" ayarıyla uçta yapılır. 80'i kapalı tutmak, SSL/TLS modu
# yanlışlıkla "Flexible"a alınırsa sitenin sessizce şifresiz çalışmasını değil,
# görünür şekilde bozulmasını sağlar — sessiz güvensizlikten iyidir.

<VirtualHost *:443>
    ServerName deresys.com.tr
    ServerAlias www.deresys.com.tr

    DocumentRoot /var/www/deresys.com.tr/current

    SSLEngine on
    # Cloudflare Origin Certificate — yalnızca Cloudflare tarafından güvenilir.
    # Tarayıcı bu sertifikayı hiç görmez; uçtaki sertifikayı Cloudflare sunar.
    SSLCertificateFile    /etc/ssl/cloudflare/deresys.com.tr.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/deresys.com.tr.key

    # Authenticated Origin Pulls: Cloudflare istemci sertifikası zorunlu.
    # IP listesi güncellenmeden yeni bir Cloudflare aralığı çıksa bile
    # origin'e Cloudflare dışından bağlanılamaz.
    SSLVerifyClient require
    SSLVerifyDepth 1
    SSLCACertificateFile /etc/ssl/cloudflare/origin-pull-ca.pem

    Protocols h2 http/1.1

    <Directory /var/www/deresys.com.tr/current>
        # FollowSymLinks zorunlu: DocumentRoot'un kendisi "current" symlink'i
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Gizli dosyalar, yedekler ve kaynak artıkları asla servis edilmez
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.|~$|\.(bak|orig|swp|log)$">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        # Hash'li varlıklar — içerik değişirse dosya adı değişir.
        # Cloudflare bu başlığa uyar ve uçta da uzun süre saklar.
        <LocationMatch "^/_astro/">
            Header always set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>

        # HTML önbelleğe alınmaz — deploy anında yayına girsin.
        # Cloudflare varsayılan olarak HTML'i zaten önbelleğe almaz; bu başlık
        # "Cache Everything" kuralı eklenirse de doğru davranışı garanti eder.
        <LocationMatch "\.html$|^/$|/$">
            Header always set Cache-Control "no-cache, must-revalidate"
        </LocationMatch>
    </IfModule>

    ErrorDocument 404 /404.html

    ErrorLog  ${APACHE_LOG_DIR}/deresys.error.log
    CustomLog ${APACHE_LOG_DIR}/deresys.access.log privacy

    # --- İleride: form endpoint'i ---
    # CSP form-action zaten 'self'. Hız sınırı için Cloudflare Rate Limiting
    # kullanılmalı — uçta durdurmak origin'e kadar getirmekten iyidir.
    #
    # <Location /api/iletisim>
    #     ProxyPass        http://127.0.0.1:8081/
    #     ProxyPassReverse http://127.0.0.1:8081/
    #     RequestHeader set X-Forwarded-Proto "https"
    # </Location>
</VirtualHost>

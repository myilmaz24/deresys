# /etc/apache2/sites-available/000-default-deny.conf
#
# Apache, bir IP:port için sites-enabled içindeki İLK vhost'u varsayılan sayar
# ve yükleme sırası alfabetiktir. "000-default-deny.conf" hem Ubuntu'nun
# "000-default.conf" dosyasından hem de site vhost'undan önce gelir.
#
# Amaç: alan adı eşleşmeyen istekler (origin IP'sine doğrudan tarama, yanlış
# Host başlığı) site içeriğine ulaşamasın.

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/_default

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    <Directory /var/www/_default>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    RedirectMatch 403 "^/.*$"

    ErrorLog  ${APACHE_LOG_DIR}/default-deny.error.log
    CustomLog ${APACHE_LOG_DIR}/default-deny.access.log privacy
</VirtualHost>
